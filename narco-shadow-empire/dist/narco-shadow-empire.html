<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>NARCO: SHADOW EMPIRE - Operation Numbers</title>
<meta name="description" content="A cinematic 3D investigation game that trains ASVAB Arithmetic Reasoning and Mathematics Knowledge. Unofficial study aid.">
<style>
  html, body { margin: 0; height: 100%; background: #05070b; color: #e8eef5; overflow: hidden; overscroll-behavior: none; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          background: radial-gradient(ellipse at 50% 60%, #0d1622 0%, #05070b 70%); z-index: 9999;
          font: 600 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; letter-spacing: .28em; text-transform: uppercase; color: #9fb3c8; }
  #boot b { font-size: clamp(22px, 4vw, 44px); letter-spacing: .18em; color: #f2f5f9; }
  #boot i { font-style: normal; color: #f0a43a; }
  #boot.done { opacity: 0; pointer-events: none; transition: opacity .6s ease; }
</style>
<style>
/* src/styles/base.css */
/* base.css - design tokens + resets shared by every UI module.
   OWNER: the UI-base module (src/ui/ui.js). Other UI modules use these tokens and never redefine them.
   Token names below are a contract - extend, do not rename. */
:root {
  --ui-scale: 1;                         /* = settings.textScale (set on :root by ui.js) */
  font-size: calc(16px * var(--ui-scale));

  /* surfaces */
  --c-bg: #05070b;
  --c-panel: rgba(9, 13, 20, 0.88);
  --c-panel-solid: #0b111a;
  --c-panel-2: rgba(18, 26, 38, 0.9);
  --c-line: rgba(150, 185, 220, 0.18);
  --c-line-strong: rgba(150, 185, 220, 0.38);
  /* text */
  --c-text: #e9eff6;
  --c-dim: #a3b4c7;
  --c-mute: #6c7d92;
  /* accents: amber = AR / primary action, teal = MK / information, magenta = neon highlight (sparingly) */
  --c-accent: #f0a43a;
  --c-accent-ink: #1a1206;
  --c-teal: #35d0c0;
  --c-neon: #ff3d81;
  --c-ar: #f0a43a;
  --c-mk: #35d0c0;
  /* status (never rely on colour alone - pair with an icon or word) */
  --c-good: #4cd98a;
  --c-bad: #ff6b6b;
  --c-warn: #ffd166;

  --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --font-display: "Arial Narrow", "Roboto Condensed", "Helvetica Neue", Arial, sans-serif; /* use uppercase + letter-spacing */

  --radius: 0.5rem;
  --radius-sm: 0.3rem;
  --gap: 0.75rem;
  --pad: 1rem;
  --shadow: 0 0.6rem 2.4rem rgba(0, 0, 0, 0.55);
  --blur: blur(10px);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --t-fast: 120ms;
  --t-med: 240ms;

  --z-hud: 10;
  --z-touch: 30;
  --z-modal: 40;
  --z-overlay: 60;
  --z-toast: 70;
}
:root.high-contrast {
  --c-panel: rgba(0, 0, 0, 0.96);
  --c-panel-solid: #000;
  --c-line: rgba(255, 255, 255, 0.55);
  --c-line-strong: #fff;
  --c-text: #fff;
  --c-dim: #e6edf5;
  --c-mute: #c3cedb;
}
:root.reduced-motion *, :root.reduced-motion *::before, :root.reduced-motion *::after {
  animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important;
}
#ui { font-family: var(--font-ui); color: var(--c-text); line-height: 1.45; -webkit-font-smoothing: antialiased; }
#ui *, #ui *::before, #ui *::after { box-sizing: border-box; }
#ui button, #ui input, #ui select, #ui textarea { font: inherit; color: inherit; }
#ui :focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

/* src/styles/hud.css */
/* hud.css - owned by its UI module (see docs/ARCHITECTURE.md) */

/* src/styles/menus.css */
/* menus.css - owned by its UI module (see docs/ARCHITECTURE.md) */

/* src/styles/phone.css */
/* phone.css - owned by its UI module (see docs/ARCHITECTURE.md) */

/* src/styles/puzzle.css */
/* puzzle.css - owned by its UI module (see docs/ARCHITECTURE.md) */

/* src/styles/study.css */
/* study.css - owned by its UI module (see docs/ARCHITECTURE.md) */

/* src/styles/visuallab.css */
/* visuallab.css - owned by its UI module (see docs/ARCHITECTURE.md) */

/* src/styles/touch.css */
/* touch.css - owned by its UI module (see docs/ARCHITECTURE.md) */

</style>
